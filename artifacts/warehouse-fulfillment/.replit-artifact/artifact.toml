kind = "web"
previewPath = "/"
title = "Warehouse Fulfilment Storage Management"
description = "A clean, beginner-friendly warehouse management website for tracking products and storage locations with dashboard statistics, search, and basic CRUD operations."
version = "1.0.0"
id = "artifacts/warehouse-fulfillment"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20261

[services.development]
run = "pnpm --filter @workspace/warehouse-fulfillment run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/warehouse-fulfillment", "run", "build" ]
serve = "static"
publicDir = "artifacts/warehouse-fulfillment/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20261"
BASE_PATH = "/"
